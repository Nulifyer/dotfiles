# Kitty preferences. Colors are generated by the shared `theme` command.

# Font
font_family      CaskaydiaMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
window_padding_width  8
placement_strategy    center
hide_window_decorations no
dynamic_background_opacity yes
background_opacity    0.95
auto_reload_config    0.1
wayland_titlebar_color background
confirm_os_window_close 0

# Cursor
cursor_shape             underline
cursor_shape_unfocused   hollow
cursor_underline_thickness 2.0
cursor_blink_interval    0
shell_integration        no-cursor

# Scrollback and mouse
scrollback_lines         10000
wheel_scroll_multiplier  3.0
mouse_hide_wait          3.0
copy_on_select           clipboard

tab_bar_style              powerline
tab_powerline_style        slanted

# Generated by `./dotfiles theme NAME` and installed through Stow.
include ~/.config/kitty/theme.generated.conf

# Keep the familiar Alacritty shortcuts while retaining Kitty's defaults.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f show_scrollback
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end
map ctrl+0          change_font_size all 0
