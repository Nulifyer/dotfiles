# Kitty theme based on the custom VS Code Gruvbox palette.

# Font
font_family      CaskaydiaMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Ensure the prompt's distro, Git, and chevron glyphs use a Nerd Font.
symbol_map U+E000-U+F8FF FantasqueSansM Nerd Font Mono

# Window
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
window_padding_width  8
placement_strategy    center
hide_window_decorations no
dynamic_background_opacity yes
background_opacity    0.95
wayland_titlebar_color background
confirm_os_window_close 0

# Cursor
cursor_shape             underline
cursor_shape_unfocused   hollow
cursor_underline_thickness 2.0
cursor_blink_interval    0
shell_integration        no-cursor

# Scrollback and mouse
scrollback_lines         10000
wheel_scroll_multiplier  3.0
mouse_hide_wait          3.0
copy_on_select           clipboard

# Gruvbox palette shared with VS Code
foreground            #DDC7A1
background            #202020
selection_foreground  #EBDBB2
selection_background  #2A2827
cursor                 #DDC7A1
url_color              #7DAEA3

active_border_color   #A9B665
inactive_border_color #3B3B3B
bell_border_color     #D8A657

tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_foreground      #202020
active_tab_background      #A9B665
inactive_tab_foreground    #DDC7A1
inactive_tab_background    #323232
tab_bar_background         #1B1B1B

color0  #2A2827
color1  #EA6962
color2  #A9B665
color3  #D8A657
color4  #7DAEA3
color5  #D3869B
color6  #89B482
color7  #DDC7A1

color8  #746A62
color9  #EA6962
color10 #A9B665
color11 #D8A657
color12 #7DAEA3
color13 #D3869B
color14 #89B482
color15 #EBDBB2

# Keep the familiar Alacritty shortcuts while retaining Kitty's defaults.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f show_scrollback
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end
map ctrl+0          change_font_size all 0
